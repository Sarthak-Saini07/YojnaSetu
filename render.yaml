# Render Blueprint Deployment Configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: govt-scheme-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false # Set securely in Render Dashboard (e.g. mongodb+srv://... with Atlas credentials)
      - key: DATABASE_NAME
        value: government_scheme_db
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a cryptographically secure 256-bit secret
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false # Optional custom domains (Render frontend domain *.onrender.com is auto-allowed)
      - key: LLM_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false # Optional: Set if using Gemini API

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React + Vite)
  # ---------------------------------------------------------------------------
  - type: web
    name: govt-scheme-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: govt-scheme-backend
          property: host

